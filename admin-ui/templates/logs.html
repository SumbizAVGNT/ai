{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}

<!-- Controls Card -->
<div class="card" style="margin-bottom: 20px;">
    <div class="card-header">
        <h3 class="card-title">Container Logs</h3>
        <div class="action-buttons">
            <button class="btn btn-secondary btn-small" data-action="load-logs" title="Refresh logs">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                Refresh
            </button>
        </div>
    </div>
    
    <form id="logs-form" class="stack-form" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: end;">
        <div class="form-group" style="margin:0;">
            <label class="form-label" for="log-service">Service</label>
            <select id="log-service" class="form-select">
                <option value="llama-server-coder">llama-server-coder</option>
                <option value="token-gateway">token-gateway</option>
                <option value="local-ai-nginx">local-ai-nginx</option>
                <option value="admin-ui">admin-ui</option>
                <option value="postgres">postgres</option>
                <option value="opencode-server">opencode-server</option>
                <option value="codex-runner">codex-runner</option>
                <option value="claude-code-proxy">claude-code-proxy</option>
            </select>
        </div>
        
        <div class="form-group" style="margin:0;">
            <label class="form-label" for="log-tail">Tail Lines</label>
            <input type="number" id="log-tail" class="form-input" value="300" min="10" max="2000">
        </div>
        
        <div class="form-group" style="margin:0;">
            <label class="form-label" for="log-filter">Filter Output</label>
            <input type="text" id="log-filter" class="form-input" placeholder="Type to filter lines...">
        </div>
        
        <div style="display: flex; align-items: center; gap: 12px; padding-top: 24px;">
            <label class="form-checkbox">
                <input type="checkbox" id="logs-follow">
                <span>Auto-follow (Live)</span>
            </label>
        </div>
    </form>
</div>

<!-- Output Card -->
<div class="card">
    <div class="card-header">
        <h3 class="card-title">Log Output</h3>
        <span class="status neutral" id="log-status">Ready</span>
    </div>
    <pre id="logs-output" class="logs-output">Click "Refresh" or submit the form to load logs. Enable Auto-follow for live updates.</pre>
</div>

{% endblock %}
