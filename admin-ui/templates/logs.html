{% extends "base.html" %}{% block title %}Logs{% endblock %}{% block content %}
<div class="card full"><form method="get" action="{{ base }}/logs" class="formgrid"><div class="field"><label>Service</label><select name="service"><option {% if service=='token-gateway' %}selected{% endif %}>token-gateway</option><option {% if service=='llama-server-coder' %}selected{% endif %}>llama-server-coder</option><option {% if service=='local-ai-nginx' %}selected{% endif %}>local-ai-nginx</option><option {% if service=='admin-ui' %}selected{% endif %}>admin-ui</option><option {% if service=='postgres' %}selected{% endif %}>postgres</option></select></div><div class="field"><label>Tail</label><input name="tail" value="{{ tail }}"></div><div style="align-self:end"><button class="btn">Refresh</button></div></form><br><div class="pre">{{ logs }}</div></div>
{% endblock %}
