{% extends "base.html" %}{% block title %}Users{% endblock %}{% block content %}
{% if message %}<div class="msg">{{ message }}</div>{% endif %}
<div class="grid"><div class="card full"><h2>Создать пользователя</h2><form method="post" action="{{ base }}/users/create" class="formgrid"><div class="field"><label>Логин</label><input name="username" required></div><div class="field"><label>Пароль</label><input name="password" type="password" required></div><div class="field"><label>Роль</label><input name="role" value="admin"></div><div style="align-self:end"><button class="btn">Создать</button></div></form></div><div class="card full"><h2>Пользователи</h2><table class="table"><tr><th>ID</th><th>Login</th><th>Role</th><th>Enabled</th><th>Actions</th></tr>{% for u in users %}<tr><form method="post" action="{{ base }}/users/{{ u[0] }}/update"><td>{{ u[0] }}</td><td><input name="username" value="{{ u[1] }}"></td><td>{{ u[2] }}</td><td><input type="checkbox" name="enabled" {% if u[3] %}checked{% endif %}></td><td><div class="row-actions"><input name="password" type="password" placeholder="new password" style="width:180px"><button class="btn secondary">Save</button></form><form method="post" action="{{ base }}/users/{{ u[0] }}/delete"><button class="btn danger">Delete</button></form></div></td></tr>{% endfor %}</table></div></div>
{% endblock %}
