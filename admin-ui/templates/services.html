{% extends "base.html" %}
{% block title %}Services{% endblock %}
{% block content %}
<div class="container-fluid">
    {% if message %}
    <div class="alert alert-info"><i class="fas fa-info-circle"></i> {{ message }}</div>
    {% endif %}
    
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-dark">
                    <h5 class="card-title mb-0"><i class="fas fa-server"></i> Service Management</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Status</th>
                                    <th>Image</th>
                                    <th>Ports</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for s in services %}
                                <tr>
                                    <td><strong>{{ s.name }}</strong></td>
                                    <td>
                                        <span class="badge {% if s.status == 'running' %}bg-success{% elif s.status == 'stopped' %}bg-danger{% elif s.status == 'restarting' %}bg-warning{% else %}bg-secondary{% endif %}">
                                            {{ s.status }}
                                        </span>
                                    </td>
                                    <td><code class="text-info">{{ s.image }}</code></td>
                                    <td>{{ s.ports or '-' }}</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <form method="post" action="{{ base }}/services/{{ s.name }}/start" class="d-inline">
                                                <button type="submit" class="btn btn-success" title="Start"><i class="fas fa-play"></i></button>
                                            </form>
                                            <form method="post" action="{{ base }}/services/{{ s.name }}/restart" class="d-inline">
                                                <button type="submit" class="btn btn-warning" title="Restart"><i class="fas fa-redo"></i></button>
                                            </form>
                                            <form method="post" action="{{ base }}/services/{{ s.name }}/stop" class="d-inline">
                                                <button type="submit" class="btn btn-danger" title="Stop"><i class="fas fa-stop"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
