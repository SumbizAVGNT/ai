{% extends "base.html" %}{% block title %}System Prompt{% endblock %}{% block content %}
{% if message %}<div class="msg">{{ message }}</div>{% endif %}
<div class="card full"><h2>Gateway prompt injection</h2><p class="muted">Этот prompt автоматически добавляется в /v1/chat/completions, чтобы модель не просила подтверждение и отвечала сразу.</p><form method="post" action="{{ base }}/prompt"><label class="pill"><input type="checkbox" name="inject_system_prompt_enabled" style="width:auto" {% if config.inject_system_prompt_enabled %}checked{% endif %}> Включено</label><br><br><textarea name="system_prompt">{{ config.system_prompt }}</textarea><br><br><button class="btn">Сохранить</button></form></div>
{% endblock %}
