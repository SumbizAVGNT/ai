# Generated by ./install.sh. This placeholder is overwritten by the installer.
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "localai"
      POSTGRES_USER: "localai"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-localai}"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  llama-server-coder:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: llama-server-coder
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./models:/models:ro
      - ./config/llama.env:/config/llama.env:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      . /config/llama.env &&
      exec /app/llama-server -m "$${MODEL_PATH}" --host 0.0.0.0 --port 8081
      -c "$${CTX_SIZE:-32768}" -t "$${THREADS:-16}" --jinja
      -np "$${PARALLEL_SLOTS:-1}" --timeout "$${LLAMA_TIMEOUT:-1200}"
      --n-gpu-layers "$${N_GPU_LAYERS:-0}" $${LLAMA_EXTRA_ARGS:-}

  token-gateway:
    build: ./token-gateway
    container_name: token-gateway
    restart: unless-stopped
    depends_on:
      - llama-server-coder
    volumes:
      - ./data:/data
    environment:
      TOKENS_FILE: "/data/tokens.json"
      CONFIG_FILE: "/data/config.json"
      UPSTREAM: "http://llama-server-coder:8081"
      UPSTREAM_API_KEY: "sk-dummy"
      ADMIN_KEY: "${ADMIN_KEY:-change-me-run-install}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-1200}"
    ports:
      - "127.0.0.1:9000:9000"

  admin-ui:
    build: ./admin-ui
    container_name: admin-ui
    restart: unless-stopped
    depends_on:
      - postgres
      - token-gateway
    volumes:
      - ./:/stack
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ROOT_PATH: "/ui"
      DOMAIN: "${DOMAIN:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://127.0.0.1}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://localai:localai@postgres:5432/localai}"
      ADMIN_KEY: "${ADMIN_KEY:-change-me-run-install}"
      ADMIN_WEB_SECRET: "${ADMIN_WEB_SECRET:-local-ai-admin-change-me}"
      ADMIN_UI_SECRET: "${ADMIN_WEB_SECRET:-local-ai-admin-change-me}"
      ADMIN_WEB_USERNAME: "${ADMIN_WEB_USERNAME:-admin}"
      ADMIN_WEB_PASSWORD: "${ADMIN_WEB_PASSWORD:-admin}"
      ADMIN_UI_USER: "${ADMIN_WEB_USERNAME:-admin}"
      ADMIN_UI_PASSWORD: "${ADMIN_WEB_PASSWORD:-admin}"
      TOKEN_GATEWAY_URL: "http://token-gateway:9000"
    ports:
      - "127.0.0.1:8088:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: local-ai-nginx
    restart: unless-stopped
    depends_on:
      - token-gateway
      - admin-ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    container_name: local-ai-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  postgres-data:
