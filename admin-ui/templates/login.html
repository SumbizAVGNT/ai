<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Local AI Stack</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        /* Fallback to ensure perfect layout before CSS loads */
        body { overflow: hidden; }
        .login-container { min-height: 100vh; }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-grid"></div>
    <div class="bg-orb one"></div>
    <div class="bg-orb two"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">⚡</div>
                <h1 class="login-title">Local AI Stack</h1>
                <p class="login-subtitle">Secure Admin Access{% if domain %} · {{ domain }}{% endif %}</p>
            </div>

            {% if error %}
            <div class="alert alert-error" style="margin-bottom: 16px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ base }}/login" class="stack-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-large w-100" style="margin-top: 8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    Sign In ✦
                </button>
            </form>

            <p style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
                Powered by Local AI Admin v3.2
            </p>
        </div>
    </div>
</body>
</html>
