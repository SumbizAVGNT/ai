{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="container-fluid">
    {% if message %}
    <div class="alert alert-info"><i class="fas fa-info-circle"></i> {{ message }}</div>
    {% endif %}
    
    <div class="row g-4">
        <!-- Create User Form -->
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header bg-dark">
                    <h5 class="card-title mb-0"><i class="fas fa-user-plus"></i> Create User</h5>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ base }}/users/create">
                        <div class="mb-3">
                            <label class="form-label">Login</label>
                            <input name="username" class="form-control" required placeholder="username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <input name="role" class="form-control" value="admin">
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-plus"></i> Create</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Users Table -->
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-dark">
                    <h5 class="card-title mb-0"><i class="fas fa-users"></i> Users</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Login</th>
                                    <th>Role</th>
                                    <th>Enabled</th>
                                    <th>New Password</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for u in users %}
                                <tr>
                                    <form method="post" action="{{ base }}/users/{{ u[0] }}/update">
                                        <td>{{ u[0] }}</td>
                                        <td><input name="username" class="form-control form-control-sm" value="{{ u[1] }}"></td>
                                        <td>{{ u[2] }}</td>
                                        <td>
                                            <div class="form-check form-switch">
                                                <input type="checkbox" name="enabled" class="form-check-input" {% if u[3] %}checked{% endif %}>
                                            </div>
                                        </td>
                                        <td>
                                            <input name="password" type="password" class="form-control form-control-sm" placeholder="new password" style="width:150px">
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <button type="submit" class="btn btn-secondary"><i class="fas fa-save"></i></button>
                                            </div>
                                            <form method="post" action="{{ base }}/users/{{ u[0] }}/delete" class="d-inline" onsubmit="return confirm('Delete this user?')">
                                                <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                                            </form>
                                        </td>
                                    </form>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
