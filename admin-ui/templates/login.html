<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local AI Admin Login</title><link rel="stylesheet" href="/static/admin.css"></head>
<body class="login-body"><div class="sakura"></div><main class="login-card glass"><div class="moon">☾</div><h1>Local AI Stack</h1><p class="muted">Anime admin panel{% if domain %} · {{ domain }}{% endif %}</p>{% if error %}<div class="toast bad">{{ error }}</div>{% endif %}<form method="post" action="/login" class="stack"><input name="username" placeholder="Логин" autocomplete="username" required><input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button class="primary" type="submit">Войти ✦</button></form></main></body></html>
